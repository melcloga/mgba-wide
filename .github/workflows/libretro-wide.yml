name: mgba-wide libretro cores

on:
  push:
    branches: [ master, main, 'wide/**' ]
  workflow_dispatch:

env:
  COMMON_FLAGS: >-
    -DCMAKE_BUILD_TYPE=Release
    -DBUILD_LIBRETRO=ON
    -DBUILD_QT=OFF -DBUILD_SDL=OFF
    -DBUILD_STATIC=OFF
    -DBUILD_GL=OFF -DBUILD_GLES2=OFF -DBUILD_GLES3=OFF
    -DUSE_FFMPEG=OFF -DUSE_LUA=OFF -DUSE_SQLITE3=OFF -DUSE_EDITLINE=OFF
    -DUSE_DISCORD_RPC=OFF -DUSE_ELF=OFF -DUSE_LIBZIP=OFF -DUSE_MINIZIP=OFF
    -DUSE_LZMA=OFF -DUSE_JSON_C=OFF -DUSE_FREETYPE=OFF -DUSE_EPOXY=OFF
    -DUSE_PNG=OFF -DENABLE_SCRIPTING=OFF -DSKIP_GIT=ON

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (NDK, arm64-v8a)
        run: |
          cmake -S . -B build $COMMON_FLAGS \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21
      - name: Build
        run: cmake --build build --target mgba_libretro -j 4
      - name: Package
        run: |
          mkdir -p out
          cp build/mgba_libretro.so out/mgba_wide_libretro_android.so
          "$ANDROID_NDK_LATEST_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip out/mgba_wide_libretro_android.so
          cp res/mgba_wide_libretro.info out/
      - uses: actions/upload-artifact@v4
        with:
          name: mgba-wide-android-arm64
          path: out/

  windows-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Configure (MinGW cross)
        run: |
          cmake -S . -B build $COMMON_FLAGS \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc-posix \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++-posix \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DUSE_ZLIB=OFF \
            -DCMAKE_SHARED_LINKER_FLAGS="-static-libgcc -static"
      - name: Build
        run: cmake --build build --target mgba_libretro -j 4
      - name: Package
        run: |
          mkdir -p out
          f=$(ls build/*mgba_libretro*.dll | head -1)
          cp "$f" out/mgba_wide_libretro.dll
          x86_64-w64-mingw32-strip out/mgba_wide_libretro.dll
          cp res/mgba_wide_libretro.info out/
      - uses: actions/upload-artifact@v4
        with:
          name: mgba-wide-windows-x64
          path: out/
